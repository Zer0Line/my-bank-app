spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/bank-realm
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: accounts-service
              uri: lb://accounts-service
              predicates:
                - Path=/api/accounts/**
              filters:
                - name: RequestLogging
                - name: JwtTokenRelay
            - id: transfer-service
              uri: lb://transfer-service
              predicates:
                - Path=/api/transfers/**
              filters:
                - name: RequestLogging
                - name: JwtTokenRelay
            - id: cash-service
              uri: lb://cash-service
              predicates:
                - Path=/api/cash/**
              filters:
                - name: RequestLogging
                - name: JwtTokenRelay
          discovery:
            locator:
              enabled: true
server:
  port: 9091

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    ru.yandex.practicum.gateway: DEBUG
    org.springframework.cloud.gateway: TRACE
