spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: bank-ui
            client-secret: ui-client-secret
            authorization-grant-type: authorization_code
            scope: openid, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider: keycloak
        provider:
          keycloak:
            authorization-uri: http://localhost:8082/realms/bank-realm/protocol/openid-connect/auth
            token-uri: http://localhost:8082/realms/bank-realm/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8082/realms/bank-realm/protocol/openid-connect/certs
            user-info-uri: http://localhost:8082/realms/bank-realm/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
server:
  port: 9090
gateway:
  base-url: http://localhost:9091
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
logging:
  level:
    ru.yandex.practicum.mybankfront.client: DEBUG
