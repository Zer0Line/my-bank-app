spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: bank-ui
            client-secret: ${UI_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider: keycloak
        provider:
          keycloak:
            authorization-uri: http://localhost:18082/realms/bank-realm/protocol/openid-connect/auth
            token-uri: http://localhost:18082/realms/bank-realm/protocol/openid-connect/token
            jwk-set-uri: http://localhost:18082/realms/bank-realm/protocol/openid-connect/certs
            user-info-uri: http://localhost:18082/realms/bank-realm/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 3
    instances:
      accounts-client:
        base-config: default
      transfer-client:
        base-config: default
      cash-client:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - feign.RetryableException
    instances:
      accounts-client:
        base-config: default
      transfer-client:
        base-config: default
      cash-client:
        base-config: default
server:
  port: 9090
app:
  logstash:
    host: localhost
gateway:
  base-url: http://localhost:8081
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
