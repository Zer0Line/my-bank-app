plugins {
    id 'java'
    alias libs.plugins.spring.boot apply false
    alias libs.plugins.spring.dependency.management
}

group = 'ru.yandex.practicum'
version = '0.0.3-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.spring.cloud.get()}"
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    def servicePorts = [
        'accounts-service'     : '9092',
        'cash-service'         : '8084',
        'transfer-service'     : '8083',
        'notification-service' : '8085',
        'frontend-service'     : '9090',
    ]

    pluginManager.withPlugin('org.springframework.boot') {
        dependencies {
            implementation libs.spring.boot.starter.actuator
            implementation libs.micrometer.registry.prometheus
            implementation libs.logstash.logback.encoder
        }
        sourceSets {
            main {
                resources {
                    srcDir rootProject.file('config/logback')
                }
            }
        }
        tasks.named('bootBuildImage') {
            onlyIf { false }
        }
        def jarSha256 = { File f ->
            java.security.MessageDigest.getInstance('SHA-256')
                .digest(f.bytes)
                .collect { String.format('%02x', it) }
                .join()
        }

        tasks.register('dockerBuildImage') {
            dependsOn tasks.named('bootJar')
            doLast {
                def imageTag = "${project.name}:${project.version}"
                def jarFile = tasks.named('bootJar').get().archiveFile.get().asFile
                def relativeJar = rootProject.rootDir.toPath().relativize(jarFile.toPath())
                def port = servicePorts[project.name]
                def hash = jarSha256(jarFile)

                // Пропускаем пересборку если образ уже содержит именно этот jar.
                def label = new ByteArrayOutputStream()
                def inspect = exec {
                    commandLine 'docker', 'image', 'inspect',
                        '--format', '{{index .Config.Labels "ru.yandex.practicum.jar-sha256"}}',
                        imageTag
                    standardOutput = label
                    errorOutput = new ByteArrayOutputStream()
                    ignoreExitValue true
                }

                if (inspect.exitValue == 0 && label.toString().trim() == hash) {
                    logger.lifecycle("Image '{}' up to date (jar sha256={}), skipping", imageTag, hash)
                    return
                }

                exec {
                    workingDir rootProject.rootDir
                    commandLine 'docker', 'build',
                        '-t', imageTag,
                        '--label', "ru.yandex.practicum.jar-sha256=${hash}",
                        '--build-arg', "JAR_FILE=${relativeJar}",
                        '--build-arg', "APP_PORT=${port}",
                        '-f', 'Dockerfile',
                        '.'
                }
                logger.lifecycle("Image '{}' built successfully (jar sha256={})", imageTag, hash)
            }
        }
    }
}

def serviceProjects = [
    'accounts-service',
    'cash-service',
    'transfer-service',
    'notification-service',
    'frontend-service'
]

tasks.register('dockerBuildImages') {
    group = 'docker'
    description = 'Build Docker images for all services'
    dependsOn subprojects.findAll { p -> serviceProjects.contains(p.name) }
        .collect { "${it.path}:dockerBuildImage" }
    doFirst {
        logger.lifecycle("=== Docker image build plan ===")
        serviceProjects.each { name ->
            def imageTag = "${name}:${version}"
            def result = exec {
                commandLine 'docker', 'image', 'inspect', imageTag
                ignoreExitValue true
            }
            if (result.exitValue == 0) {
                logger.lifecycle("  [SKIP]  {} already exists", imageTag)
            } else {
                logger.lifecycle("  [BUILD] {}", imageTag)
            }
        }
        logger.lifecycle("===============================")
    }
}

