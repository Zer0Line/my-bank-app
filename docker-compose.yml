# Frontend-service запускается на хост-машине через docker-compose.
# PostgreSQL, Keycloak и backend-микросервисы работают в minikube (Helm).
#
# Пользовательские адреса — только на localhost:
#   - frontend-service: http://localhost:9090
#   - Keycloak (admin): http://localhost:18082/admin/  (admin / admin)
#     — через kubectl port-forward svc/keycloak 18082:8082 -n bank
#   - PostgreSQL:       localhost:5432                  (через kubectl port-forward)
#
# Маршрутизация API — через Ingress (nginx) на localhost:8081:
#   /api/accounts  → accounts-service:9092
#   /api/cash      → cash-service:8084
#   /api/transfers → transfer-service:8083
#
# KC_HOSTNAME_URL=http://localhost:18082 (helm/keycloak/values.yaml) — issuer JWT.
# Не менять порт port-forward, иначе сломается валидация issuer в backend-сервисах.

services:
  frontend-service:
    image: frontend-service:0.0.3-SNAPSHOT
    network_mode: host
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/config/"
      UI_CLIENT_SECRET: ui-client-secret
    volumes:
      - ./docker/frontend/application.yaml:/config/application.yaml:ro
