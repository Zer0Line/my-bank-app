apiVersion: v1
kind: Service
metadata:
  name: {{ include "elk.elasticsearch.fullname" . }}
  labels:
    {{- include "elk.elasticsearch.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "elk.elasticsearch.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.elasticsearch.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: transport
      port: {{ .Values.elasticsearch.service.transportPort }}
      targetPort: transport
      protocol: TCP