apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "transfer-service.fullname" . }}-config
  labels:
    {{- include "transfer-service.labels" . | nindent 4 }}
data:
  application.yaml: |
    spring:
      security:
        oauth2:
          resourceserver:
            jwt:
              # Keycloak запущен на хосте (docker-compose). Его issuer (KC_HOSTNAME_URL) —
              # localhost:8082, недоступный из подов, поэтому проверяем подпись
              # через JWKS-эндпоинт внутрикластерного Service "keycloak".
              jwk-set-uri: http://keycloak:8082/realms/bank-realm/protocol/openid-connect/certs
          client:
            registration:
              service-client:
                client-id: transfer-service
                client-secret: ${SERVICE_CLIENT_SECRET}
                authorization-grant-type: client_credentials
            provider:
              service-client:
                token-uri: http://keycloak:8082/realms/bank-realm/protocol/openid-connect/token
      kafka:
        bootstrap-servers: {{ .Values.kafka.bootstrapServers }}
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
          acks: all
          retries: 10
    resilience4j:
      circuitbreaker:
        configs:
          default:
            sliding-window-size: 5
            failure-rate-threshold: 50
            wait-duration-in-open-state: 10s
            permitted-number-of-calls-in-half-open-state: 3
            minimum-number-of-calls: 3
        instances:
          accounts-service:
            base-config: default
            ignoreExceptions:
              - ru.yandex.practicum.transfer.exception.InsufficientFundsException
              - ru.yandex.practicum.transfer.exception.OperationNotificationException
          notification-service:
            base-config: default
      retry:
        configs:
          default:
            max-attempts: 3
            wait-duration: 500ms
            retry-exceptions:
              - org.springframework.web.client.ResourceAccessException
              - java.net.ConnectException
              - java.net.SocketTimeoutException
              - feign.RetryableException
        instances:
          accounts-service:
            base-config: default
          notification-service:
            base-config: default
    clients:
      accounts-service:
        url: http://accounts-service:9092
    app:
      security:
        oauth2:
          resourceserver:
            jwt:
              jwk-set-uri: http://keycloak:8082/realms/bank-realm/protocol/openid-connect/certs
              issuer-uri: http://localhost:8082/realms/bank-realm
              audiences: bank-ui
    server:
      port: 8083
