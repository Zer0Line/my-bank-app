replicaCount: 1

image:
  repository: gateway-service
  tag: 0.0.3-SNAPSHOT
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: gateway-service

service:
  type: ClusterIP
  port: 9091

probes:
  path: /actuator/health

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
