apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway-service.fullname" . }}-config
  labels:
    {{- include "gateway-service.labels" . | nindent 4 }}
data:
  application.yaml: |
    spring:
      security:
        oauth2:
          resourceserver:
            jwt:
              # Keycloak запущен на хосте (docker-compose). Его issuer (KC_HOSTNAME_URL) —
              # localhost:8082, недоступный из подов, поэтому проверяем подпись
              # через JWKS-эндпоинт внутрикластерного Service "keycloak".
              jwk-set-uri: http://keycloak:8082/realms/bank-realm/protocol/openid-connect/certs
      cloud:
        gateway:
          server:
            webflux:
              routes:
                - id: accounts-service
                  uri: http://accounts-service:9092
                  predicates:
                    - Path=/api/accounts/**
                  filters:
                    - name: JwtTokenRelay
                - id: transfer-service
                  uri: http://transfer-service:8083
                  predicates:
                    - Path=/api/transfers/**
                  filters:
                    - name: JwtTokenRelay
                - id: cash-service
                  uri: http://cash-service:8084
                  predicates:
                    - Path=/api/cash/**
                  filters:
                    - name: JwtTokenRelay
    server:
      port: 9091
    app:
      security:
        oauth2:
          resourceserver:
            jwt:
              jwk-set-uri: http://keycloak:8082/realms/bank-realm/protocol/openid-connect/certs
              issuer-uri: http://localhost:8082/realms/bank-realm
              audiences: bank-ui
    management:
      tracing:
        sampling:
          probability: 1.0
    logging:
      level:
        ru.yandex.practicum.gateway: DEBUG
        org.springframework.cloud.gateway: TRACE
