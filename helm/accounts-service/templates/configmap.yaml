apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "accounts-service.fullname" . }}-config
  labels:
    {{- include "accounts-service.labels" . | nindent 4 }}
data:
  application.yaml: |
    spring:
      liquibase:
        change-log: classpath:/db/changelog/db.changelog-master.xml
      datasource:
        url: jdbc:postgresql://postgres:5432/bankdb
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: org.postgresql.Driver
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: true
      security:
        oauth2:
          resourceserver:
            jwt:
              # Keycloak запущен на хосте (docker-compose). Его issuer (KC_HOSTNAME_URL) —
              # localhost:8082, недоступный из подов, поэтому проверяем подпись
              # через JWKS-эндпоинт внутрикластерного Service "keycloak".
              jwk-set-uri: http://keycloak:8082/realms/bank-realm/protocol/openid-connect/certs
          client:
            registration:
              service-client:
                client-id: transfer-service
                client-secret: ${SERVICE_CLIENT_SECRET}
                authorization-grant-type: client_credentials
            provider:
              service-client:
                token-uri: http://keycloak:8082/realms/bank-realm/protocol/openid-connect/token
      kafka:
        bootstrap-servers: {{ .Values.kafka.bootstrapServers }}
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
          acks: all
          retries: 10
    resilience4j:
      circuitbreaker:
        configs:
          default:
            sliding-window-size: 5
            failure-rate-threshold: 50
            wait-duration-in-open-state: 10s
            permitted-number-of-calls-in-half-open-state: 3
            minimum-number-of-calls: 3
        instances:
          notification-service:
            base-config: default
      retry:
        configs:
          default:
            max-attempts: 3
            wait-duration: 500ms
            retry-exceptions:
              - org.springframework.web.client.ResourceAccessException
              - java.net.ConnectException
              - java.net.SocketTimeoutException
              - feign.RetryableException
        instances:
          notification-service:
            base-config: default
    app:
      outbox:
        poll-interval: 5000
        batch-size: 100
    server:
      port: 9092
