apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "accounts-service.fullname" . }}-config
  labels:
    {{- include "accounts-service.labels" . | nindent 4 }}
data:
  application.yaml: |
    spring:
      sql:
        init:
          mode: always
          continue-on-error: true
      datasource:
        url: jdbc:postgresql://postgres:5432/bankdb
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: org.postgresql.Driver
      jpa:
        defer-datasource-initialization: true
        hibernate:
          ddl-auto: update
        show-sql: true
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://keycloak:8080/realms/bank-realm
          client:
            registration:
              service-client:
                client-id: transfer-service
                client-secret: ${SERVICE_CLIENT_SECRET}
                authorization-grant-type: client_credentials
            provider:
              service-client:
                token-uri: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/token
    resilience4j:
      circuitbreaker:
        configs:
          default:
            sliding-window-size: 5
            failure-rate-threshold: 50
            wait-duration-in-open-state: 10s
            permitted-number-of-calls-in-half-open-state: 3
            minimum-number-of-calls: 3
        instances:
          notification-service:
            base-config: default
      retry:
        configs:
          default:
            max-attempts: 3
            wait-duration: 500ms
            retry-exceptions:
              - org.springframework.web.client.ResourceAccessException
              - java.net.ConnectException
              - java.net.SocketTimeoutException
              - feign.RetryableException
        instances:
          notification-service:
            base-config: default
    server:
      port: 9092
