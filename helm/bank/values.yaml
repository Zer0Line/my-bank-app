# Umbrella-chart пробрасывает значения в свои подчарты.
# Любое значение можно переопределить через --set bank.chartname.key=value или свой values-файл.

postgres:
  enabled: true

accounts-service:
  enabled: true

cash-service:
  enabled: true

transfer-service:
  enabled: true

notification-service:
  enabled: true

# Apache Kafka (KRaft): 1 нода-контроллер + 1 брокер.
# Конфигурация — в подчарте helm/kafka
kafka:
  enabled: true

keycloak:
  enabled: true
  # KC_HOSTNAME_URL — issuer всех JWT. Должен совпадать с адресом port-forward
  # (kubectl port-forward svc/keycloak 18082:8082 -n bank), через который ходят
  # браузер и frontend-service. backend-сервисы валидируют issuer по этому же URL.
  hostname:
    url: http://localhost:18082
    strict: false

# Zipkin разворачивается внутри minikube чартом openzipkin/zipkin (image 3.5)
zipkin:
  enabled: true
  fullnameOverride: zipkin
  image:
    repository: openzipkin/zipkin
    tag: "3.5"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9411

# ELK: Logstash собирает логи микросервисов через TCP input (порт 5000) и
# поставляет их в Elasticsearch (OSS 7.10.2, индексы bank-logs-*). Чарт helm/elk.
elk:
  enabled: true

# Prometheus разворачивается внутри minikube локальным чартом helm/prometheus (image prom/prometheus).
prometheus:
  enabled: true

# Grafana разворачивается чартом grafana/grafana (image grafana/grafana).
# Доступ:
#   - Ingress:        http://localhost:8081/grafana/  (nginx -> grafana:3000, serve_from_sub_path)
#   - port-forward:   kubectl port-forward -n bank svc/grafana 13000:3000 -> http://localhost:13000/grafana/
# Логин/пароль по умолчанию
grafana:
  enabled: true
  fullnameOverride: grafana
  adminUser: admin
  adminPassword: admin
  service:
    type: ClusterIP
    port: 3000
  # Grafana ходит в in-cluster Service prometheus.
  # uid задан явно: на него ссылаются alert rules (datasourceUid) и дашборды (DS_PROMETHEUS).
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          uid: prometheus
  # Алерты Grafana Alerting (провиженинг в /etc/grafana/provisioning/alerting/):
  #   - CPU:     process_cpu_usage > 80%
  #   - Memory:  JVM heap used/max > 80%
  #   - 4xx:     > 3 ответов с кодом 4xx за 5 минут
  #   - 5xx:     > 3 ответов с кодом 5xx за 5 минут
  # Метрики Spring Boot (Micrometer) из /actuator/prometheus.
  alerting:
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: 'Bank Service Alerts'
          folder: 'Alerts'
          interval: 1m
          rules:
            - uid: cpu-high
              title: 'CPU high (process_cpu_usage > 80%)'
              condition: C
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: 'CPU usage > 80%'
                description: 'process_cpu_usage по сервису превысил 80%'
              data:
                - refId: A
                  datasourceUid: prometheus
                  model:
                    refId: A
                    datasource:
                      type: prometheus
                      uid: prometheus
                    expr: 'max by (job) (process_cpu_usage)'
                    instant: true
                    range: false
                    intervalMs: 1000
                    maxDataPoints: 43200
                  relativeTimeRange:
                    from: 300
                    to: 0
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    datasource:
                      type: __expr__
                      uid: __expr__
                    type: threshold
                    expression: A
                    conditions:
                      - type: query
                        evaluator:
                          type: gt
                          params:
                            - 0.8
                        operator:
                          type: and
                        query:
                          params:
                            - A
                        reducer:
                          type: last
                  relativeTimeRange:
                    from: 0
                    to: 0
            - uid: memory-high
              title: 'JVM heap high (> 80%)'
              condition: C
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: 'JVM heap usage > 80%'
                description: 'jvm_memory_used_bytes{area="heap"} превысил 80% от jvm_memory_max_bytes'
              data:
                - refId: A
                  datasourceUid: prometheus
                  model:
                    refId: A
                    datasource:
                      type: prometheus
                      uid: prometheus
                    expr: 'sum by (job) (jvm_memory_used_bytes{area="heap"}) / clamp_min(sum by (job) (jvm_memory_max_bytes{area="heap"}), 1)'
                    instant: true
                    range: false
                    intervalMs: 1000
                    maxDataPoints: 43200
                  relativeTimeRange:
                    from: 300
                    to: 0
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    datasource:
                      type: __expr__
                      uid: __expr__
                    type: threshold
                    expression: A
                    conditions:
                      - type: query
                        evaluator:
                          type: gt
                          params:
                            - 0.8
                        operator:
                          type: and
                        query:
                          params:
                            - A
                        reducer:
                          type: last
                  relativeTimeRange:
                    from: 0
                    to: 0
            - uid: http-4xx-high
              title: 'HTTP 4xx > 3 за 5m'
              condition: C
              for: 2m
              labels:
                severity: warning
              annotations:
                summary: 'Более 3 ответов 4xx за 5 минут'
                description: 'sum(increase(http_server_requests_seconds_count{status=~"4.."}[5m])) by (job) > 3'
              data:
                - refId: A
                  datasourceUid: prometheus
                  model:
                    refId: A
                    datasource:
                      type: prometheus
                      uid: prometheus
                    expr: 'sum by (job) (increase(http_server_requests_seconds_count{status=~"4.."}[5m]))'
                    instant: true
                    range: false
                    intervalMs: 1000
                    maxDataPoints: 43200
                  relativeTimeRange:
                    from: 300
                    to: 0
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    datasource:
                      type: __expr__
                      uid: __expr__
                    type: threshold
                    expression: A
                    conditions:
                      - type: query
                        evaluator:
                          type: gt
                          params:
                            - 3
                        operator:
                          type: and
                        query:
                          params:
                            - A
                        reducer:
                          type: last
                  relativeTimeRange:
                    from: 0
                    to: 0
            - uid: http-5xx-high
              title: 'HTTP 5xx > 3 за 5m'
              condition: C
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: 'Более 3 ответов 5xx за 5 минут'
                description: 'sum(increase(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job) > 3'
              data:
                - refId: A
                  datasourceUid: prometheus
                  model:
                    refId: A
                    datasource:
                      type: prometheus
                      uid: prometheus
                    expr: 'sum by (job) (increase(http_server_requests_seconds_count{status=~"5.."}[5m]))'
                    instant: true
                    range: false
                    intervalMs: 1000
                    maxDataPoints: 43200
                  relativeTimeRange:
                    from: 300
                    to: 0
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    datasource:
                      type: __expr__
                      uid: __expr__
                    type: threshold
                    expression: A
                    conditions:
                      - type: query
                        evaluator:
                          type: gt
                          params:
                            - 3
                        operator:
                          type: and
                        query:
                          params:
                            - A
                        reducer:
                          type: last
                  relativeTimeRange:
                    from: 0
                    to: 0
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      http-metrics:
        # Дашборд с HTTP-метриками: RPS, 4xx, 5xx, персентили таймингов.
        json: |
          {
            "annotations": { "list": [] },
            "editable": true,
            "fiscalYearStartMonth": 0,
            "graphTooltip": 0,
            "id": null,
            "links": [],
            "panels": [
              {
                "collapsed": false,
                "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
                "id": 1,
                "panels": [],
                "title": "Трафик",
                "type": "row"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
                "fieldConfig": {
                  "defaults": {
                    "unit": "reqps",
                    "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
                  },
                  "overrides": []
                },
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
                "id": 2,
                "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] } },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (job)",
                    "legendFormat": "{{job}}",
                    "refId": "A"
                  }
                ],
                "title": "HTTP: RPS по сервисам",
                "type": "timeseries"
              },
              {
