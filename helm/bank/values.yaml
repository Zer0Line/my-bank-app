# Umbrella-chart пробрасывает значения в свои подчарты.
# Любое значение можно переопределить через --set bank.chartname.key=value или свой values-файл.

postgres:
  enabled: true

accounts-service:
  enabled: true

cash-service:
  enabled: true

transfer-service:
  enabled: true

notification-service:
  enabled: true

# Apache Kafka (KRaft): 1 нода-контроллер + 1 брокер.
# Конфигурация — в подчарте helm/kafka
kafka:
  enabled: true

keycloak:
  enabled: true
  # KC_HOSTNAME_URL — issuer всех JWT. Должен совпадать с адресом port-forward
  # (kubectl port-forward svc/keycloak 18082:8082 -n bank), через который ходят
  # браузер и frontend-service. backend-сервисы валидируют issuer по этому же URL.
  hostname:
    url: http://localhost:18082
    strict: false

# Zipkin разворачивается внутри minikube чартом openzipkin/zipkin (image 3.5)
zipkin:
  enabled: true
  fullnameOverride: zipkin
  image:
    repository: openzipkin/zipkin
    tag: "3.5"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9411

# Prometheus разворачивается внутри minikube локальным чартом helm/prometheus (image prom/prometheus).
prometheus:
  enabled: true

# Grafana разворачивается чартом grafana/grafana (image grafana/grafana).
# Доступ:
#   - Ingress:        http://localhost:8081/grafana/  (nginx -> grafana:3000, serve_from_sub_path)
#   - port-forward:   kubectl port-forward -n bank svc/grafana 13000:3000 -> http://localhost:13000/grafana/
# Логин/пароль по умолчанию
grafana:
  enabled: true
  fullnameOverride: grafana
  adminUser: admin
  adminPassword: admin
  service:
    type: ClusterIP
    port: 3000
  # Grafana ходит в in-cluster Service prometheus.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      http-metrics:
        # Дашборд с HTTP-метриками: RPS, 4xx, 5xx, персентили таймингов.
        json: |
          {
            "annotations": { "list": [] },
            "editable": true,
            "fiscalYearStartMonth": 0,
            "graphTooltip": 0,
            "id": null,
            "links": [],
            "panels": [
              {
                "collapsed": false,
                "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
                "id": 1,
                "panels": [],
                "title": "Трафик",
                "type": "row"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
                "fieldConfig": {
                  "defaults": {
                    "unit": "reqps",
                    "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
                  },
                  "overrides": []
                },
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
                "id": 2,
                "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] } },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (job)",
                    "legendFormat": "{{job}}",
                    "refId": "A"
                  }
                ],
                "title": "HTTP: RPS по сервисам",
                "type": "timeseries"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
                "fieldConfig": {
                  "defaults": {
                    "unit": "reqps",
                    "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
                  },
                  "overrides": []
                },
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
                "id": 3,
                "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] } },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{status=~\"4..\"}[1m])) by (job)",
                    "legendFormat": "{{job}}",
                    "refId": "A"
                  }
                ],
                "title": "HTTP: 4xx RPS по сервисам",
                "type": "timeseries"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
                "fieldConfig": {
                  "defaults": {
                    "unit": "reqps",
                    "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
                  },
                  "overrides": []
                },
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
                "id": 4,
                "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] } },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[1m])) by (job)",
                    "legendFormat": "{{job}}",
                    "refId": "A"
                  }
                ],
                "title": "HTTP: 5xx RPS по сервисам",
                "type": "timeseries"
              },
              {
                "collapsed": false,
                "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
                "id": 5,
                "panels": [],
                "title": "Тайминги (персентили)",
                "type": "row"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
                "fieldConfig": {
                  "defaults": {
                    "unit": "ms",
                    "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
                  },
                  "overrides": []
                },
                "gridPos": { "h": 8, "w": 8, "x": 0, "y": 18 },
                "id": 6,
                "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] } },
                "targets": [
                  {
                    "expr": "avg(http_server_requests_seconds{quantile=\"0.5\"}) by (job) * 1000",
                    "legendFormat": "p50 {{job}}",
                    "refId": "A"
                  }
                ],
                "title": "Latency p50 (мс)",
                "type": "timeseries"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
                "fieldConfig": {
                  "defaults": {
                    "unit": "ms",
                    "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
                  },
                  "overrides": []
                },
                "gridPos": { "h": 8, "w": 8, "x": 8, "y": 18 },
                "id": 7,
                "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] } },
                "targets": [
                  {
                    "expr": "avg(http_server_requests_seconds{quantile=\"0.95\"}) by (job) * 1000",
                    "legendFormat": "p95 {{job}}",
                    "refId": "A"
                  }
                ],
                "title": "Latency p95 (мс)",
                "type": "timeseries"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
                "fieldConfig": {
                  "defaults": {
                    "unit": "ms",
                    "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
                  },
                  "overrides": []
                },
                "gridPos": { "h": 8, "w": 8, "x": 16, "y": 18 },
                "id": 8,
                "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] } },
                "targets": [
                  {
                    "expr": "avg(http_server_requests_seconds{quantile=\"0.99\"}) by (job) * 1000",
                    "legendFormat": "p99 {{job}}",
                    "refId": "A"
                  }
                ],
                "title": "Latency p99 (мс)",
                "type": "timeseries"
              }
            ],
            "refresh": "10s",
            "schemaVersion": 39,
            "tags": ["metrics", "http", "spring-boot"],
            "templating": {
              "list": [
                {
                  "type": "datasource",
                  "name": "DS_PROMETHEUS",
                  "label": "Prometheus",
                  "query": "prometheus",
                  "current": {
                    "value": "PBFA97CFB590B2093",
                    "text": "Prometheus"
                  },
                  "hide": 0,
                  "regex": "",
                  "options": [],
                  "includeAll": false,
                  "multi": false
                }
              ]
            },
            "time": { "from": "now-6h", "to": "now" },
            "timepicker": {},
            "timezone": "",
            "title": "HTTP-метрики сервисов (RPS, 4xx, 5xx, персентили)",
            "uid": "http-metrics",
            "version": 1,
            "weekStart": ""
          }
  # Работа под Ingress-префиксом /grafana
  "grafana.ini":
    server:
      root_url: http://localhost:8081/grafana
      serve_from_sub_path: true
    auth.anonymous:
      enabled: true
      org_role: Viewer
