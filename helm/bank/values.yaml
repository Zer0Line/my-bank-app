# Umbrella-chart пробрасывает значения в свои подчарты.
# Любое значение можно переопределить через --set bank.chartname.key=value или свой values-файл.

postgres:
  enabled: true

gateway-service:
  enabled: true

accounts-service:
  enabled: true

cash-service:
  enabled: true

transfer-service:
  enabled: true

notification-service:
  enabled: true

# Apache Kafka (KRaft): 1 нода-контроллер + 1 брокер.
# Конфигурация — в подчарте helm/kafka
kafka:
  enabled: true

# Keycloak и frontend-service запускаются через docker-compose на хосте, а не в Kubernetes.
# externalKeycloak.host — адрес хост-машины с точки зрения подов Kubernetes
# (docker bridge gateway сети minikube). Посмотреть можно так: minikube ssh "ip route"
externalKeycloak:
  host: 192.168.49.1
  port: 8082

externalZipkin:
  host: 192.168.49.1
  port: 9411
