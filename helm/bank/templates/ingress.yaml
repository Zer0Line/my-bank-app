apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bank-ingress
  # Без rewrite: backend-контроллеры ожидают полный путь (/api/accounts и т.д.)
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/accounts
            pathType: Prefix
            backend:
              service:
                name: accounts-service
                port:
                  number: 9092
          - path: /api/transfers
            pathType: Prefix
            backend:
              service:
                name: transfer-service
                port:
                  number: 8083
          - path: /api/cash
            pathType: Prefix
            backend:
              service:
                name: cash-service
                port:
                  number: 8084
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8082
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8082
