apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bank-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/accounts(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: accounts-service
                port:
                  number: 9092
          - path: /api/transfers(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: transfer-service
                port:
                  number: 8083
          - path: /api/cash(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: cash-service
                port:
                  number: 8084
