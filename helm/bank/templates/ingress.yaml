apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bank-ingress
  # Без rewrite: backend-контроллеры ожидают полный путь (/api/accounts и т.д.)
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/accounts
            pathType: Prefix
            backend:
              service:
                name: accounts-service
                port:
                  number: 9092
          - path: /api/transfers
            pathType: Prefix
            backend:
              service:
                name: transfer-service
                port:
                  number: 8083
          - path: /api/cash
            pathType: Prefix
            backend:
              service:
                name: cash-service
                port:
                  number: 8084
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8082
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8082
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /prometheus(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Grafana работает под subpath /grafana (serve_from_sub_path=true), поэтому
          # префикс НЕ срезаем nginx-rewrite — его обрабатывает сам Grafana.
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
