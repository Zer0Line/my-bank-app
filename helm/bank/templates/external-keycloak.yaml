# Keycloak запущен через docker-compose на хост-машине.
# Этот Service делает его доступным для сервисов Kubernetes под именем "keycloak".
# Адрес — хост-машина с точки зрения подов (docker bridge gateway сети minikube).
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.externalKeycloak.port }}
      targetPort: {{ .Values.externalKeycloak.port }}
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: keycloak
subsets:
  - addresses:
      - ip: {{ .Values.externalKeycloak.host | quote }}
    ports:
      - name: http
        port: {{ .Values.externalKeycloak.port }}
