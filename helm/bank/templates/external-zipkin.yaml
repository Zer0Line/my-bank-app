# Zipkin запущен через docker-compose на хост-машине.
# Этот Service делает его доступным для сервисов Kubernetes под именем "zipkin".
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.externalZipkin.port }}
      targetPort: {{ .Values.externalZipkin.port }}
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: zipkin-external
  labels:
    kubernetes.io/service-name: zipkin
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.externalZipkin.host | quote }}
ports:
  - name: http
    port: {{ .Values.externalZipkin.port }}
    protocol: TCP
