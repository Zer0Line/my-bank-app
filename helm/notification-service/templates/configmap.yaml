apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-service.fullname" . }}-config
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
data:
  application.yaml: |
    spring:
      liquibase:
        change-log: classpath:/db/changelog/db.changelog-master.xml
      datasource:
        url: jdbc:postgresql://postgres:5432/bankdb
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: org.postgresql.Driver
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: true
      security:
        oauth2:
          resourceserver:
            jwt:
              # Keycloak запущен в minikube. Проверяем подпись через JWKS-эндпоинт
              # внутрикластерного Service "keycloak".
              jwk-set-uri: http://keycloak:8082/realms/bank-realm/protocol/openid-connect/certs
      kafka:
        bootstrap-servers: {{ .Values.kafka.bootstrapServers }}
        listener:
          observation-enabled: true
        consumer:
          group-id: notification-service
          auto-offset-reset: earliest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
          properties:
            spring.json.trusted.packages: "*"
            spring.json.value.default.type: ru.yandex.practicum.notification.dto.OperationRequest
            spring.json.use.type.headers: "false"
    management:
      tracing:
        sampling:
          probability: 1.0
      zipkin:
        tracing:
          endpoint: http://zipkin:9411/api/v2/spans
    server:
      port: 8085
