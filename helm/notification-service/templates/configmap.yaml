apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-service.fullname" . }}-config
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
data:
  application.yaml: |
    spring:
      sql:
        init:
          mode: always
          continue-on-error: true
      datasource:
        url: jdbc:postgresql://postgres:5432/bankdb
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: org.postgresql.Driver
      jpa:
        defer-datasource-initialization: true
        hibernate:
          ddl-auto: update
        show-sql: true
        properties:
          hibernate:
            hbm2ddl:
              create_namespaces: true
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://keycloak:8080/realms/bank-realm
    server:
      port: 8085
